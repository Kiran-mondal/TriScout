<!DOCTYPE html>
<html>
<head>
    <title>TRISCOUT // LOGIN</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <style>
        /* লগইন পেজকে একদম মাঝখানে রাখার জন্য */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* লগইন বক্সের নতুন ডিজাইন এবং সাইজ */
        .login-card {
            background: var(--card-bg);
            padding: 40px; /* ভেতরে স্পেস বাড়ানো হয়েছে */
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 450px; /* ডেস্কটপে বক্সটি এখন অনেক চওড়া ও সুন্দর দেখাবে */
            box-sizing: border-box;
            position: relative;
        }

        /* সাইবার কর্নার ডিজাইন */
        .login-card::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            width: 15px;
            height: 15px;
            border-top: 2px solid var(--accent-green);
            border-left: 2px solid var(--accent-green);
        }

        /* নতুন হেডার: লোগো + TRISCOUT */
        .logo-header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 35px;
        }
        
        .logo-header img {
            width: 45px;
            height: 45px;
            margin-right: 15px;
        }

        .logo-header h2 {
            color: var(--accent-green);
            letter-spacing: 4px;
            margin: 0;
            font-size: 32px;
            text-shadow: 0 0 8px rgba(212, 255, 0, 0.4);
        }

        /* ডিভাইডার (OR LOCAL ADMIN) */
        .divider {
            text-align: center;
            margin: 30px 0;
            color: var(--text-muted);
            font-size: 12px;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
        }
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px dashed var(--border-color);
        }
        .divider::before { margin-right: 15px; }
        .divider::after { margin-left: 15px; }
        
        /* বাটন স্টাইল */
        .github-btn {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--text-main);
            width: 100%;
        }
        .github-btn:hover {
            background: var(--text-main);
            color: #000;
        }
        .full-width-btn {
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="login-card">
        
        <!-- আপডেট করা হেডার (লোগো + নাম) -->
        <div class="logo-header">
            <img src="/logo.svg" alt="TriScout Logo">
            <h2>TRISCOUT</h2>
        </div>

        <!-- গিটহাব লগইন -->
        <!-- এখানে href এর জায়গায় আপনার আসল গিটহাব অথেন্টিকেশন লিংকটি দেবেন -->
        <button class="github-btn" onclick="window.location.href='/api/auth/github'">
            > AUTHENTICATE VIA GITHUB
        </button>

        <div class="divider">OR LOCAL ADMIN</div>

        <!-- লোকাল লগইন -->
        <input type="text" id="username" class="input-box" placeholder="USERNAME">
        <input type="password" id="password" class="input-box" placeholder="PASSWORD">
        
        <button class="full-width-btn" onclick="login()">ACCESS SYSTEM</button>
    </div>

    <script>
        // আপনার লোকাল লগইন ফাংশন এখানে থাকবে
        function login() {
            // Login logic
            alert('LOCAL LOGIN FUNCTION INITIATED');
        }
    </script>
</body>
</html>
