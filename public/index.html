<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TriScout — Ethical Passive Reconnaissance & Security Posture Console</title>
    <meta name="description" content="TriScout v2.4 TAC-OPS is an on-demand passive cybersecurity reconnaissance dashboard and CLI tool for auditing HTTP security headers, DNS topology, and source leaks." />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet"/>
    
    <!-- OpenGraph Tags for Uneed / Product Directories -->
    <meta property="og:title" content="TriScout — Defensive Cyber Reconnaissance Console" />
    <meta property="og:description" content="On-demand ethical security scanner with real-time network topology simulation, HTTP header posture grading, and automated vulnerability reporting." />
    <meta property="og:url" content="https://triscout.quarry.dpdns.org" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://triscout.quarry.dpdns.org/logo.svg" />
    <meta name="twitter:card" content="summary_large_image" />
</head>
<body class="bg-[#10131b] text-[#e0e2ed] font-['Inter'] min-h-screen flex items-center justify-center p-4 bg-[radial-gradient(#1d2027_1px,transparent_1px)] [background-size:20px_20px]">

    <div class="max-w-md w-full bg-[#181b23] border border-[#32353d]/60 rounded-2xl p-6 sm:p-8 shadow-2xl">
        
        <div class="flex flex-col items-center text-center mb-5">
            <img src="/logo.svg" alt="TriScout" class="w-14 h-14 mb-2.5 object-contain" />
            <div class="flex items-center gap-2 mb-1">
                <h1 class="text-2xl font-bold tracking-tight text-white">TriScout</h1>
                <span class="font-['JetBrains_Mono'] text-[10px] bg-[#1d2027] text-[#39ff88] border border-[#39ff88]/40 px-2 py-0.5 rounded uppercase font-bold">v2.4 TAC-OPS</span>
            </div>
            <p class="text-xs text-[#bacbb9] font-['JetBrains_Mono']">Authorized Defensive Reconnaissance Console</p>
        </div>

        <!-- Auth Mode Switcher (Sign In vs Sign Up) -->
        <div class="grid grid-cols-2 gap-1 p-1 bg-[#10131b] rounded-xl border border-[#32353d]/60 mb-5 font-['JetBrains_Mono'] text-xs">
            <button id="tab-login-btn" type="button" onclick="switchAuthView('login')" class="py-2 rounded-lg font-bold uppercase transition-all bg-[#272a32] text-[#39ff88] shadow cursor-pointer">
                Sign In
            </button>
            <button id="tab-register-btn" type="button" onclick="switchAuthView('register')" class="py-2 rounded-lg font-bold uppercase transition-all text-[#bacbb9] hover:text-white cursor-pointer">
                Create Account
            </button>
        </div>

        <!-- Notification Banner -->
        <div id="auth-alert" class="hidden mb-4 p-3 rounded-lg font-['JetBrains_Mono'] text-xs border"></div>

        <!-- FORM 1A: SIGN IN (STEP 1 - CREDENTIALS) -->
        <form id="login-form" onsubmit="handleLoginStep1(event)" class="space-y-3.5 font-['JetBrains_Mono'] text-xs">
            <div>
                <label class="block text-[10px] text-[#bacbb9] uppercase mb-1">Operator Username or Email</label>
                <input type="text" id="login-username" required placeholder="Enter Username or Email" class="w-full px-3.5 py-2.5 rounded-lg bg-[#10131b] border border-[#32353d] text-white focus:outline-none focus:border-[#39ff88]"/>
            </div>
            <div id="legacy-email-box" class="hidden">
                <label class="block text-[10px] text-[#aeecff] uppercase mb-1">Link Email Address (For Sign-In OTP)</label>
                <input type="email" id="login-legacy-email" placeholder="operator@domain.com" class="w-full px-3.5 py-2.5 rounded-lg bg-[#10131b] border border-[#aeecff] text-white focus:outline-none"/>
            </div>
            <div>
                <div class="flex items-center justify-between mb-1">
                    <label class="text-[10px] text-[#bacbb9] uppercase">Access Passkey</label>
                    <button type="button" onclick="switchAuthView('forgot')" class="text-[10px] text-[#aeecff] hover:underline cursor-pointer">Forgot Passkey?</button>
                </div>
                <input type="password" id="login-password" required placeholder="••••••••••••" class="w-full px-3.5 py-2.5 rounded-lg bg-[#10131b] border border-[#32353d] text-white focus:outline-none focus:border-[#39ff88]"/>
            </div>
            <button id="login-submit-btn" type="submit" class="w-full py-3 rounded-xl bg-[#39ff88] hover:bg-[#63ff95] text-[#003918] font-bold uppercase tracking-wider transition-all shadow-[0_0_16px_rgba(57,255,136,0.3)] cursor-pointer mt-2">
                Authenticate Session
            </button>
        </form>

        <!-- FORM 1B: SIGN IN (STEP 2 - 2FA EMAIL OTP VERIFICATION) -->
        <form id="login-otp-form" onsubmit="handleLoginStep2(event)" class="hidden space-y-3.5 font-['JetBrains_Mono'] text-xs">
            <div class="p-3 rounded-lg bg-[#10131b] border border-[#32353d] text-[#bacbb9] leading-relaxed">
                Enter the 6-digit Sign-In OTP sent to <span id="login-otp-target-email" class="text-[#39ff88] font-bold"></span>
            </div>
            <div>
                <label class="block text-[10px] text-[#bacbb9] uppercase mb-1">6-Digit Sign-In OTP</label>
                <input type="text" id="login-otp-code" required maxlength="6" pattern="\d{6}" placeholder="123456" class="w-full px-3.5 py-2.5 rounded-lg bg-[#10131b] border border-[#32353d] text-center text-lg tracking-[0.4em] text-[#39ff88] font-bold focus:outline-none focus:border-[#39ff88]"/>
            </div>
            <button id="login-verify-btn" type="submit" class="w-full py-3 rounded-xl bg-[#39ff88] hover:bg-[#63ff95] text-[#003918] font-bold uppercase tracking-wider transition-all cursor-pointer">
                Verify Sign-In OTP
            </button>
            <button type="button" onclick="switchAuthView('login')" class="w-full py-2 text-[#bacbb9] hover:text-white text-[11px] uppercase cursor-pointer">
                &larr; Back to Sign In
            </button>
        </form>

        <!-- FORM 2A: CREATE ACCOUNT (STEP 1 - USER DETAILS) -->
        <form id="register-form" onsubmit="handleRegisterStep1(event)" class="hidden space-y-3.5 font-['JetBrains_Mono'] text-xs">
            <div>
                <label class="block text-[10px] text-[#bacbb9] uppercase mb-1">Choose Unique Operator Username</label>
                <input type="text" id="reg-username" required minlength="3" maxlength="30" pattern="[a-zA-Z0-9_\-]+" title="Letters, numbers, underscores, and hyphens only" placeholder="e.g. cyber_sentinel" class="w-full px-3.5 py-2.5 rounded-lg bg-[#10131b] border border-[#32353d] text-white focus:outline-none focus:border-[#aeecff]"/>
            </div>
            <div>
                <label class="block text-[10px] text-[#bacbb9] uppercase mb-1">Email Address (Max 5 OTPs/min)</label>
                <input type="email" id="reg-email" required placeholder="operator@domain.com" class="w-full px-3.5 py-2.5 rounded-lg bg-[#10131b] border border-[#32353d] text-white focus:outline-none focus:border-[#aeecff]"/>
            </div>
            <div>
                <label class="block text-[10px] text-[#bacbb9] uppercase mb-1">Create Passkey (Min 6 chars)</label>
                <input type="password" id="reg-password" required minlength="6" placeholder="••••••••••••" class="w-full px-3.5 py-2.5 rounded-lg bg-[#10131b] border border-[#32353d] text-white focus:outline-none focus:border-[#aeecff]"/>
            </div>
            <button id="reg-submit-btn" type="submit" class="w-full py-3 rounded-xl bg-[#aeecff] hover:bg-[#00d9ff] text-[#003918] font-bold uppercase tracking-wider transition-all shadow-[0_0_16px_rgba(174,236,255,0.3)] cursor-pointer mt-2">
                Send Verification Code
            </button>
        </form>

        <!-- FORM 2B: CREATE ACCOUNT (STEP 2 - EMAIL OTP VERIFICATION) -->
        <form id="register-otp-form" onsubmit="handleRegisterStep2(event)" class="hidden space-y-3.5 font-['JetBrains_Mono'] text-xs">
            <div class="p-3 rounded-lg bg-[#10131b] border border-[#32353d] text-[#bacbb9] leading-relaxed">
                Enter the 6-digit verification code sent to <span id="otp-target-email" class="text-[#aeecff] font-bold"></span>
            </div>
            <div>
                <label class="block text-[10px] text-[#bacbb9] uppercase mb-1">6-Digit Email Verification Code</label>
                <input type="text" id="reg-otp-code" required maxlength="6" pattern="\d{6}" placeholder="123456" class="w-full px-3.5 py-2.5 rounded-lg bg-[#10131b] border border-[#32353d] text-center text-lg tracking-[0.4em] text-[#39ff88] font-bold focus:outline-none focus:border-[#39ff88]"/>
            </div>
            <button id="reg-verify-btn" type="submit" class="w-full py-3 rounded-xl bg-[#39ff88] hover:bg-[#63ff95] text-[#003918] font-bold uppercase tracking-wider transition-all cursor-pointer">
                Verify &amp; Activate Account
            </button>
            <button type="button" onclick="switchAuthView('register')" class="w-full py-2 text-[#bacbb9] hover:text-white text-[11px] uppercase cursor-pointer">
                &larr; Back / Change Details
            </button>
        </form>

        <!-- FORM 3A: FORGOT PASSKEY (STEP 1 - REQUEST RESET CODE) -->
        <form id="forgot-form" onsubmit="handleForgotStep1(event)" class="hidden space-y-3.5 font-['JetBrains_Mono'] text-xs">
            <div class="text-xs text-[#bacbb9] leading-relaxed mb-1">
                Enter your registered username or email address to receive a 6-digit passkey reset code (Max 5 requests/min).
            </div>
            <div>
                <label class="block text-[10px] text-[#bacbb9] uppercase mb-1">Registered Email or Username</label>
                <input type="text" id="forgot-identifier" required placeholder="operator@domain.com" class="w-full px-3.5 py-2.5 rounded-lg bg-[#10131b] border border-[#32353d] text-white focus:outline-none focus:border-[#aeecff]"/>
            </div>
            <button id="forgot-submit-btn" type="submit" class="w-full py-3 rounded-xl bg-[#aeecff] hover:bg-[#00d9ff] text-[#003918] font-bold uppercase tracking-wider transition-all cursor-pointer">
                Send Reset Code
            </button>
            <button type="button" onclick="switchAuthView('login')" class="w-full py-2 text-[#bacbb9] hover:text-white text-[11px] uppercase cursor-pointer">
                &larr; Back to Sign In
            </button>
        </form>

        <!-- FORM 3B: FORGOT PASSKEY (STEP 2 - VERIFY OTP & SET NEW PASSKEY) -->
        <form id="reset-form" onsubmit="handleForgotStep2(event)" class="hidden space-y-3.5 font-['JetBrains_Mono'] text-xs">
            <div>
                <label class="block text-[10px] text-[#bacbb9] uppercase mb-1">6-Digit Reset Code</label>
                <input type="text" id="reset-otp-code" required maxlength="6" pattern="\d{6}" placeholder="123456" class="w-full px-3.5 py-2.5 rounded-lg bg-[#10131b] border border-[#32353d] text-center text-lg tracking-[0.4em] text-[#aeecff] font-bold focus:outline-none focus:border-[#aeecff]"/>
            </div>
            <div>
                <label class="block text-[10px] text-[#bacbb9] uppercase mb-1">New Passkey (Min 6 chars)</label>
                <input type="password" id="reset-new-password" required minlength="6" placeholder="••••••••••••" class="w-full px-3.5 py-2.5 rounded-lg bg-[#10131b] border border-[#32353d] text-white focus:outline-none focus:border-[#39ff88]"/>
            </div>
            <button id="reset-submit-btn" type="submit" class="w-full py-3 rounded-xl bg-[#39ff88] hover:bg-[#63ff95] text-[#003918] font-bold uppercase tracking-wider transition-all cursor-pointer">
                Update Passkey
            </button>
            <button type="button" onclick="switchAuthView('login')" class="w-full py-2 text-[#bacbb9] hover:text-white text-[11px] uppercase cursor-pointer">
                &larr; Cancel
            </button>
        </form>

        <div class="relative flex py-4 items-center">
            <div class="flex-grow border-t border-[#32353d]"></div>
            <span class="flex-shrink mx-3 text-[#849584] font-['JetBrains_Mono'] text-[10px] uppercase">OR EXTERNAL OAUTH</span>
            <div class="flex-grow border-t border-[#32353d]"></div>
        </div>

        <!-- GitHub OAuth Login Button -->
        <a href="/api/auth/github" class="w-full py-3 px-4 rounded-xl bg-[#272a32] hover:bg-[#32353d] text-white font-['JetBrains_Mono'] text-xs uppercase font-bold flex items-center justify-center gap-2.5 border border-[#32353d] transition-all">
            <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
            <span>Continue with GitHub</span>
        </a>
    </div>

    <script>
        let pendingLoginEmail = '';
        let pendingVerifyEmail = '';
        let pendingResetEmail = '';

        document.addEventListener('DOMContentLoaded', () => {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.expand();
                window.Telegram.WebApp.ready();
            }
        });

        function showAlert(msg, isError) {
            const box = document.getElementById('auth-alert');
            box.classList.remove('hidden', 'bg-red-950/40', 'border-red-500/50', 'text-red-300', 'bg-emerald-950/40', 'border-emerald-500/50', 'text-emerald-300');
            if (isError) {
                box.classList.add('bg-red-950/40', 'border-red-500/50', 'text-red-300');
            } else {
                box.classList.add('bg-emerald-950/40', 'border-emerald-500/50', 'text-emerald-300');
            }
            box.innerText = msg;
        }

        function switchAuthView(view) {
            const views = ['login-form', 'login-otp-form', 'register-form', 'register-otp-form', 'forgot-form', 'reset-form'];
            views.forEach(id => document.getElementById(id).classList.add('hidden'));
            document.getElementById('auth-alert').classList.add('hidden');

            const loginBtn = document.getElementById('tab-login-btn');
            const regBtn = document.getElementById('tab-register-btn');

            if (view === 'register' || view === 'register-otp') {
                document.getElementById(view === 'register' ? 'register-form' : 'register-otp-form').classList.remove('hidden');
                regBtn.className = "py-2 rounded-lg font-bold uppercase transition-all bg-[#272a32] text-[#aeecff] shadow cursor-pointer";
                loginBtn.className = "py-2 rounded-lg font-bold uppercase transition-all text-[#bacbb9] hover:text-white cursor-pointer";
            } else if (view === 'forgot') {
                document.getElementById('forgot-form').classList.remove('hidden');
            } else if (view === 'reset') {
                document.getElementById('reset-form').classList.remove('hidden');
            } else if (view === 'login-otp') {
                document.getElementById('login-otp-form').classList.remove('hidden');
            } else {
                document.getElementById('login-form').classList.remove('hidden');
                loginBtn.className = "py-2 rounded-lg font-bold uppercase transition-all bg-[#272a32] text-[#39ff88] shadow cursor-pointer";
                regBtn.className = "py-2 rounded-lg font-bold uppercase transition-all text-[#bacbb9] hover:text-white cursor-pointer";
            }
        }

        function toggleAuthMode(mode) {
            switchAuthView(mode);
        }

        async function handleLoginStep1(e) {
            e.preventDefault();
            const btn = document.getElementById('login-submit-btn');
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;
            const email = document.getElementById('login-legacy-email').value.trim();

            btn.disabled = true;
            btn.innerText = 'VERIFYING...';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, email })
                });
                const data = await res.json();

                if (data.needsEmail) {
                    document.getElementById('legacy-email-box').classList.remove('hidden');
                    document.getElementById('login-legacy-email').required = true;
                    showAlert(data.error, true);
                } else if (!data.success) {
                    showAlert(data.error || 'Authentication failed.', true);
                } else if (data.requireOtp) {
                    pendingLoginEmail = data.email;
                    document.getElementById('login-otp-target-email').innerText = data.email;
                    switchAuthView('login-otp');
                    showAlert(data.message, false);
                } else if (data.token) {
                    localStorage.setItem('token', data.token);
                    sessionStorage.setItem('active_session', '1');
                    showAlert('ACCESS GRANTED. Redirecting to Command Center...', false);
                    setTimeout(() => { window.location.href = '/dashboard'; }, 400);
                }
            } catch (err) {
                showAlert('Server connection failed. Please try again.', true);
            } finally {
                btn.disabled = false;
                btn.innerText = 'Authenticate Session';
            }
        }

        async function handleLoginStep2(e) {
            e.preventDefault();
            const btn = document.getElementById('login-verify-btn');
            const otp = document.getElementById('login-otp-code').value.trim();

            btn.disabled = true;
            btn.innerText = 'VERIFYING OTP...';

            try {
                const res = await fetch('/api/auth/login-verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: pendingLoginEmail, otp })
                });
                const data = await res.json();

                if (!data.success) {
                    showAlert(data.error || 'Invalid Sign-In OTP.', true);
                } else if (data.token) {
                    localStorage.setItem('token', data.token);
                    sessionStorage.setItem('active_session', '1');
                    showAlert('2FA VERIFIED! Redirecting to Command Center...', false);
                    setTimeout(() => { window.location.href = '/dashboard'; }, 400);
                }
            } catch (err) {
                showAlert('Server connection failed. Please try again.', true);
            } finally {
                btn.disabled = false;
                btn.innerText = 'Authenticate Session';
            }
        }

        async function handleLoginStep2(e) {
            e.preventDefault();
            const btn = document.getElementById('login-verify-btn');
            const otp = document.getElementById('login-otp-code').value.trim();

            btn.disabled = true;
            btn.innerText = 'VERIFYING OTP...';

            try {
                const res = await fetch('/api/auth/login-verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: pendingLoginEmail, otp })
                });
                const data = await res.json();

                if (!data.success) {
                    showAlert(data.error || 'Invalid Sign-In OTP.', true);
                } else if (data.token) {
                    localStorage.setItem('token', data.token);
                    sessionStorage.setItem('active_session', '1');
                    showAlert('2FA VERIFIED! Redirecting to Command Center...', false);
                    setTimeout(() => { window.location.href = '/dashboard'; }, 400);
                }
            } catch (err) {
                showAlert('OTP verification request failed.', true);
            } finally {
                btn.disabled = false;
                btn.innerText = 'Verify Sign-In OTP';
            }
        }

        async function handleRegisterStep1(e) {
            e.preventDefault();
            const btn = document.getElementById('reg-submit-btn');
            const username = document.getElementById('reg-username').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;

            btn.disabled = true;
            btn.innerText = 'CHECKING & SENDING CODE...';

            try {
                const res = await fetch('/api/auth/register-request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });
                const data = await res.json();

                if (!data.success) {
                    showAlert(data.error || 'Could not send verification code.', true);
                } else {
                    pendingVerifyEmail = email;
                    document.getElementById('otp-target-email').innerText = email;
                    switchAuthView('register-otp');
                    showAlert(data.message, false);
                }
            } catch (err) {
                showAlert('Network error while requesting verification code.', true);
            } finally {
                btn.disabled = false;
                btn.innerText = 'Send Verification Code';
            }
        }

        async function handleRegisterStep2(e) {
            e.preventDefault();
            const btn = document.getElementById('reg-verify-btn');
            const otp = document.getElementById('reg-otp-code').value.trim();

            btn.disabled = true;
            btn.innerText = 'VERIFYING CODE...';

            try {
                const res = await fetch('/api/auth/register-verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: pendingVerifyEmail, otp })
                });
                const data = await res.json();

                if (!data.success) {
                    showAlert(data.error || 'Verification failed.', true);
                } else if (data.token) {
                    localStorage.setItem('token', data.token);
                    sessionStorage.setItem('active_session', '1');
                    showAlert('EMAIL VERIFIED! Redirecting to Command Center...', false);
                    setTimeout(() => { window.location.href = '/dashboard'; }, 500);
                }
            } catch (err) {
                showAlert('Verification request failed.', true);
            } finally {
                btn.disabled = false;
                btn.innerText = 'Verify & Activate Account';
            }
        }

        async function handleForgotStep1(e) {
            e.preventDefault();
            const btn = document.getElementById('forgot-submit-btn');
            const identifier = document.getElementById('forgot-identifier').value.trim();

            btn.disabled = true;
            btn.innerText = 'DISPATCHING CODE...';

            try {
                const res = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier })
                });
                const data = await res.json();

                if (!data.success) {
                    showAlert(data.error || 'Account not found.', true);
                } else {
                    pendingResetEmail = data.email;
                    switchAuthView('reset');
                    showAlert(data.message, false);
                }
            } catch (err) {
                showAlert('Error communicating with server.', true);
            } finally {
                btn.disabled = false;
                btn.innerText = 'Send Reset Code';
            }
        }

        async function handleForgotStep2(e) {
            e.preventDefault();
            const btn = document.getElementById('reset-submit-btn');
            const otp = document.getElementById('reset-otp-code').value.trim();
            const newPassword = document.getElementById('reset-new-password').value;

            btn.disabled = true;
            btn.innerText = 'UPDATING PASSKEY...';

            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: pendingResetEmail, otp, newPassword })
                });
                const data = await res.json();

                if (!data.success) {
                    showAlert(data.error || 'Passkey reset failed.', true);
                } else {
                    switchAuthView('login');
                    showAlert(data.message, false);
                }
            } catch (err) {
                showAlert('Failed to update passkey.', true);
            } finally {
                btn.disabled = false;
                btn.innerText = 'Update Passkey';
            }
        }
    </script>
</body>
</html>
