    <style>
        :root {
            --bp-bg: #154078;
            --bp-line: rgba(186, 224, 255, 0.78);
            --bp-grid-major: rgba(186, 224, 255, 0.16);
            --bp-grid-minor: rgba(186, 224, 255, 0.05);
        }
        body.blueprint-canvas {
            background-color: var(--bp-bg);
            background-image:
                linear-gradient(to right, var(--bp-grid-major) 1px, transparent 1px),
                linear-gradient(to bottom, var(--bp-grid-major) 1px, transparent 1px),
                linear-gradient(to right, var(--bp-grid-minor) 1px, transparent 1px),
                linear-gradient(to bottom, var(--bp-grid-minor) 1px, transparent 1px),
                radial-gradient(circle at 50% 35%, #235aa3 0%, #0e2d56 100%);
            background-size: 80px 80px, 80px 80px, 16px 16px, 16px 16px, 100% 100%;
            background-position: center center;
        }
        .bp-frame {
            border: 1.5px solid var(--bp-line);
            box-shadow: 0 0 0 3px rgba(14, 43, 84, 0.65), 0 20px 50px rgba(4, 15, 35, 0.8);
        }
        .bp-input {
            background: rgba(10, 31, 64, 0.8);
            border: 1.5px solid rgba(186, 224, 255, 0.45);
            color: #ffffff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .bp-input:focus {
            border-color: #39ff88;
            box-shadow: 0 0 10px rgba(57, 255, 136, 0.3);
            outline: none;
        }
        .bp-input::placeholder {
            color: rgba(186, 224, 255, 0.4);
        }

        /* =====================================================================
           BIOMECHANICAL WALK CYCLE & SYNCED PARALLAX GROUND (0.96s Cycle)
           ===================================================================== */
        @keyframes scrollGroundTicks {
            from { transform: translateX(0px); }
            to { transform: translateX(-60px); }
        }
        @keyframes scrollBgSchematic {
            from { transform: translateX(0px); }
            to { transform: translateX(-160px); }
        }
        .ground-scroll-track {
            animation: scrollGroundTicks 0.96s linear infinite;
        }
        .bg-parallax-track {
            animation: scrollBgSchematic 5.6s linear infinite;
        }

        @keyframes naturalLegLeft {
            0%   { transform: rotate(20deg) translateY(0px); }
            25%  { transform: rotate(0deg) translateY(1px); }
            50%  { transform: rotate(-20deg) translateY(0px); }
            75%  { transform: rotate(0deg) translateY(-8px); }
            100% { transform: rotate(20deg) translateY(0px); }
        }
        @keyframes naturalLegRight {
            0%   { transform: rotate(-20deg) translateY(0px); }
            25%  { transform: rotate(0deg) translateY(-8px); }
            50%  { transform: rotate(20deg) translateY(0px); }
            75%  { transform: rotate(0deg) translateY(1px); }
            100% { transform: rotate(-20deg) translateY(0px); }
        }

        @keyframes naturalArmLeft {
            0%   { transform: rotate(-16deg); }
            25%  { transform: rotate(0deg); }
            50%  { transform: rotate(18deg); }
            75%  { transform: rotate(0deg); }
            100% { transform: rotate(-16deg); }
        }
        @keyframes naturalArmRight {
            0%   { transform: rotate(18deg); }
            25%  { transform: rotate(0deg); }
            50%  { transform: rotate(-16deg); }
            75%  { transform: rotate(0deg); }
            100% { transform: rotate(18deg); }
        }

        @keyframes naturalTorsoWalk {
            0%, 50%, 100% { transform: translateY(0px) rotate(0deg); }
            25%           { transform: translateY(-4.5px) rotate(-1.4deg); }
            75%           { transform: translateY(-4.5px) rotate(1.4deg); }
        }

        @keyframes naughtyGiggle {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            25% { transform: translateY(-3px) rotate(-2.5deg); }
            50% { transform: translateY(1px) rotate(2.5deg); }
            75% { transform: translateY(-3px) rotate(-2deg); }
        }
        @keyframes playfulHop {
            0%   { transform: translateY(0) scale(1); }
            35%  { transform: translateY(-18px) rotate(-3deg) scale(1.04, 0.97); }
            70%  { transform: translateY(3px) rotate(2deg) scale(0.97, 1.03); }
            100% { transform: translateY(0) scale(1); }
        }
        @keyframes welcomeWaveBody {
            0%, 100% { transform: translateY(-3px) rotate(0deg) scale(1.02); }
            25% { transform: translateY(-8px) rotate(-3deg) scale(1.04); }
            50% { transform: translateY(-3px) rotate(0deg) scale(1.02); }
            75% { transform: translateY(-8px) rotate(3deg) scale(1.04); }
        }
        @keyframes alarmedShake {
            0%, 100% { transform: translateX(0px) rotate(0deg); }
            20% { transform: translateX(-6px) rotate(-3deg); }
            40% { transform: translateX(6px) rotate(3deg); }
            60% { transform: translateX(-4px) rotate(-2deg); }
            80% { transform: translateX(4px) rotate(2deg); }
        }
        @keyframes radarSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .mascot-bob {
            transform-origin: 190px 185px;
            animation: naturalTorsoWalk 0.96s ease-in-out infinite;
        }
        .mascot-giggle {
            animation: naughtyGiggle 0.3s ease-in-out infinite !important;
        }
        .mascot-hop {
            animation: playfulHop 0.46s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
        }
        .mascot-welcome-bob {
            animation: welcomeWaveBody 1.1s ease-in-out infinite !important;
        }
        .mascot-alarmed {
            animation: alarmedShake 0.42s ease-in-out !important;
        }
        .eye-radar {
            transform-origin: 190px 88px;
            animation: radarSpin 8s linear infinite;
        }

        #mascot-left-leg {
            transform-origin: 158px 188px;
            animation: naturalLegLeft 0.96s linear infinite;
        }
        #mascot-right-leg {
            transform-origin: 214px 188px;
            animation: naturalLegRight 0.96s linear infinite;
        }
        #mascot-left-arm {
            transform-origin: 128px 112px;
            animation: naturalArmLeft 0.96s ease-in-out infinite;
            transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        #mascot-right-arm {
            transform-origin: 252px 112px;
            animation: naturalArmRight 0.96s ease-in-out infinite;
            transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        #mascot-pupil-group {
            transform-origin: 190px 88px;
            transition: transform 0.08s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform;
        }
        #pupil-iris-ring {
            transform-origin: 190px 88px;
            transition: transform 0.08s linear;
            will-change: transform;
        }
        #eyelid-top, #eyelid-bottom, #eye-closed-line, #eye-peek-line, #eye-happy-arc, #mascot-blush-l, #mascot-blush-r, #mascot-brow {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .mascot-wink #eyelid-top {
            transform: translateY(24px);
        }
        .mascot-wink #eyelid-bottom {
            transform: translateY(-20px);
        }

        /* WELCOME POSE (When all required inputs in the active form are valid) */
        .emotion-welcome #eyelid-top {
            transform: translateY(4px);
        }
        .emotion-welcome #eyelid-bottom {
            transform: translateY(-10px);
        }
        .emotion-welcome #eye-happy-arc {
            opacity: 1;
        }
        .emotion-welcome #mascot-blush-l,
        .emotion-welcome #mascot-blush-r {
            opacity: 0.85;
        }
        .emotion-welcome #mascot-left-arm {
            animation: none;
            transform: rotate(-76deg) translate(-4px, -6px);
        }
        .emotion-welcome #mascot-right-arm {
            animation: none;
            transform: rotate(76deg) translate(4px, -6px);
        }

        /* EMOTION 1: HAPPY / JOYFUL SQUINT */
        .emotion-happy #eyelid-bottom {
            transform: translateY(-16px);
        }
        .emotion-happy #eye-happy-arc {
            opacity: 1;
        }
        .emotion-happy #mascot-blush-l,
        .emotion-happy #mascot-blush-r {
            opacity: 0.75;
        }
        .emotion-happy #mascot-left-arm {
            animation: none;
            transform: rotate(-48deg);
        }
        .emotion-happy #mascot-right-arm {
            animation: none;
            transform: rotate(48deg);
        }

        /* EMOTION 2: ALARMED / STARTLED */
        .emotion-alarmed #mascot-pupil-group {
            transform: scale(1.22) !important;
        }
        .emotion-alarmed #mascot-brow {
            opacity: 1;
            transform: translateY(-3px);
        }
        .emotion-alarmed #mascot-left-arm {
            animation: none;
            transform: rotate(-35deg);
        }
        .emotion-alarmed #mascot-right-arm {
            animation: none;
            transform: rotate(35deg);
        }

        /* EMOTION 3: SHY / BOTH-HANDS SHIELD */
        .privacy-shield #eyelid-top {
            transform: translateY(25px);
        }
        .privacy-shield #eyelid-bottom {
            transform: translateY(-25px);
        }
        .privacy-shield #eye-closed-line {
            opacity: 1;
        }
        .privacy-shield #mascot-blush-l,
        .privacy-shield #mascot-blush-r {
            opacity: 0.65;
        }
        .privacy-shield #mascot-left-arm {
            animation: none;
            transform: rotate(-114deg) translate(10px, -8px);
        }
        .privacy-shield #mascot-right-arm {
            animation: none;
            transform: rotate(114deg) translate(-10px, -8px);
        }

        /* EMOTION 4: MISCHIEVOUS SNEAK PEEK */
        .privacy-peek #eyelid-top {
            transform: translateY(13px);
        }
        .privacy-peek #eyelid-bottom {
            transform: translateY(-15px);
        }
        .privacy-peek #eye-closed-line {
            opacity: 0;
        }
        .privacy-peek #eye-peek-line {
            opacity: 1;
        }
        .privacy-peek #mascot-blush-l,
        .privacy-peek #mascot-blush-r {
            opacity: 0.85;
        }
        .privacy-peek #mascot-left-arm {
            animation: none;
            transform: rotate(-108deg) translate(8px, -6px);
        }
        .privacy-peek #mascot-right-arm {
            animation: none;
            transform: rotate(60deg) translate(-4px, 6px);
        }

        @media (prefers-reduced-motion: reduce) {
            .ground-scroll-track, .bg-parallax-track, .mascot-bob, .eye-radar, #mascot-left-leg, #mascot-right-leg, #mascot-left-arm, #mascot-right-arm, .mascot-welcome-bob {
                animation: none;
            }
        }
    </style>
</head>

                        <div class="relative flex items-center">
                            <input type="password" id="reg-password" required minlength="6" placeholder="••••••••••••" class="w-full pl-3 pr-10 py-2 bp-input passkey-field"/>

                                <svg class="w-4 h-4 fill-none stroke-current" stroke-width="2" viewBox="0 0 24 24">

                        Send Verification Code &rarr;
                    </button>
    </form>

<!-- FORM 2B: VERIFY ACCOUNT OTP -->
                <form id="register-otp-form" onsubmit="handleRegisterStep2(event)" class="hidden space-y-3 text-xs">
                    <div class="p-2.5 bg-[#091e3d] border border-[#bae0ff]/50 text-[#bae0ff]">
                        Code sent to <span id="otp-target-email" class="text-[#7ce0ff] font-bold"></span>
                    </div>
                    <div>
                        <label for="reg-otp-code" class="block text-[10px] text-[#bae0ff] uppercase mb-1">6-Digit Verification Code</label>
                        <input type="text" id="reg-otp-code" required maxlength="6" pattern="\d{6}" placeholder="123456" class="w-full px-3 py-2 bp-input text-center text-base tracking-[0.4em] text-[#39ff88] font-bold"/>

                    <button id="reg-verify-btn" type="submit" class="w-full py-2.5 bg-[#39ff88] hover:bg-[#63ff95] text-[#003918] font-bold uppercase tracking-wider cursor-pointer">

                    </button>
                    <button type="button" onclick="switchAuthView('register')" class="w-full py-1 text-[#bae0ff] hover:text-white text-[11px] uppercase cursor-pointer">

                <!-- FORM 3A: FORGOT PASSKEY -->

                        <label for="forgot-identifier" class="block text-[10px] text-[#bae0ff] uppercase mb-1">Registered Email or Username</label>

                    <button type="button" onclick="switchAuthView('login')" class="w-full py-1 text-[#bae0ff] hover:text-white text-[11px] uppercase cursor-pointer">

                <!-- FORM 3B: RESET PASSKEY -->

                        <input type="text" id="reset-otp-code" required maxlength="6" pattern="\d{6}" placeholder="123456" class="w-full px-3 py-2 bp-input text-center text-base tracking-[0.4em] text-[#7ce0ff] font-bold"/>
                    </div>
                    <div>
                        <label for="reset-new-password" class="block text-[10px] text-[#bae0ff] uppercase mb-1">New Passkey</label>
                        <div class="relative flex items-center">
                            <input type="password" id="reset-new-password" required minlength="6" placeholder="••••••••••••" class="w-full pl-3 pr-10 py-2 bp-input passkey-field"/>
                            <button type="button" onclick="togglePasskeyPeek('reset-new-password', this)" class="absolute right-2.5 text-[#bae0ff] hover:text-[#39ff88] cursor-pointer p-1" title="Show / Hide Passkey">
                                <svg class="w-4 h-4 fill-none stroke-current" stroke-width="2" viewBox="0 0 24 24">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>

                        Update Passkey
                    </button>
                    <button type="button" onclick="switchAuthView('login')" class="w-full py-1 text-[#bae0ff] hover:text-white text-[11px] uppercase cursor-pointer">
                        &larr; Cancel
                    </button>
                </form>

                <!-- Compact Divider & GitHub OAuth -->
                <div class="relative flex py-3 items-center">
                    <div class="flex-grow border-t border-[#bae0ff]/35"></div>
                    <span class="flex-shrink mx-2 text-[#bae0ff]/75 text-[9px] uppercase">OR OAUTH</span>
                    <div class="flex-grow border-t border-[#bae0ff]/35"></div>
                </div>

                <a href="/api/auth/github" class="w-full py-2 px-4 bg-[#154078] hover:bg-[#1e57a0] text-white text-xs uppercase font-bold flex items-center justify-center gap-2 border border-[#bae0ff]/70 transition-all">
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
                    <span>Continue with GitHub</span>
                </a>
            </div>

        </div>
    </div>

    <script>
        let pendingLoginEmail = '';
        let pendingVerifyEmail = '';
        let pendingResetEmail = '';
        let isPasswordFocused = false;
        let isPeekingPassword = false;
        let isAllInputsValid = false;
        let hasWelcomedThisSet = false;
        let naughtySneakTimer = null;
        let emotionResetTimer = null;
        let lastInteractionTime = Date.now();

        function getActiveForm() {
            const formIds = ['login-form', 'login-otp-form', 'register-form', 'register-otp-form', 'forgot-form', 'reset-form'];
            for (const id of formIds) {
                const el = document.getElementById(id);
                if (el && !el.classList.contains('hidden')) return el;
            }
            return null;
        }

        function checkAllActiveInputsValid() {
            const activeForm = getActiveForm();
            const banner = document.getElementById('welcome-banner');
            const bannerText = document.getElementById('welcome-banner-text');
            if (!activeForm || !banner) return;

            const requiredInputs = Array.from(activeForm.querySelectorAll('input[required]')).filter(inp => {
                const hiddenParent = inp.closest('.hidden');
                return !hiddenParent && inp.offsetParent !== null;
            });

            const allValid = requiredInputs.length > 0 && requiredInputs.every(inp => {
                if (!inp.value || inp.value.trim().length === 0) return false;
                if (inp.hasAttribute('minlength') && inp.value.trim().length < Number(inp.getAttribute('minlength'))) return false;
                if (inp.hasAttribute('pattern')) {
                    const rx = new RegExp('^' + inp.getAttribute('pattern') + '$');
                    if (!rx.test(inp.value.trim())) return false;
                }
                if (inp.type === 'email' && !inp.checkValidity()) return false;
                return true;
            });

            if (allValid) {
                const userField = activeForm.querySelector('#login-username, #reg-username, #forgot-identifier');
                const handleName = userField && userField.value.trim() ? userField.value.trim().toUpperCase() : 'OPERATOR';
                if (bannerText) {
                    bannerText.innerText = `WELCOME ${handleName} // ALL INPUTS VERIFIED`;
                }
                banner.classList.remove('hidden');

                if (!isAllInputsValid && !hasWelcomedThisSet) {
                    isAllInputsValid = true;
                    hasWelcomedThisSet = true;
                    triggerWelcomePose();
                } else {
                    isAllInputsValid = true;
                }
            } else {
                isAllInputsValid = false;
                hasWelcomedThisSet = false;
                banner.classList.add('hidden');
                const svgEl = document.getElementById('mascot-svg');
                const bodyRoot = document.getElementById('mascot-body-root');
                if (svgEl) svgEl.classList.remove('emotion-welcome');
                if (bodyRoot) bodyRoot.classList.remove('mascot-welcome-bob');
                updateMascotPrivacyState();
            }
        }

        function triggerWelcomePose() {
            const svgEl = document.getElementById('mascot-svg');
            const bodyRoot = document.getElementById('mascot-body-root');
            const pupilCore = document.getElementById('pupil-core');
            const stateBadge = document.getElementById('mascot-state-badge');
            if (!svgEl || !bodyRoot) return;

            svgEl.classList.remove('privacy-shield', 'privacy-peek', 'emotion-alarmed');
            bodyRoot.classList.remove('mascot-giggle', 'mascot-alarmed');

            svgEl.classList.add('emotion-welcome');
            bodyRoot.classList.remove('mascot-hop');
            void bodyRoot.offsetWidth;
            bodyRoot.classList.add('mascot-hop', 'mascot-welcome-bob');

            if (pupilCore) pupilCore.setAttribute('fill', '#39ff88');
            if (stateBadge) {
                stateBadge.innerText = 'MOOD: WELCOME POSE';
                stateBadge.className = 'text-[#39ff88] font-bold';
            }

            setTimeout(() => {
                bodyRoot.classList.remove('mascot-hop');
            }, 480);
        }

        function triggerMascotEmotion(emotion, durationMs = 1100) {
            const svgEl = document.getElementById('mascot-svg');
            const bodyRoot = document.getElementById('mascot-body-root');
            const pupilCore = document.getElementById('pupil-core');
            const stateBadge = document.getElementById('mascot-state-badge');
            if (!svgEl || !bodyRoot) return;

            clearTimeout(emotionResetTimer);
            svgEl.classList.remove('emotion-happy', 'emotion-alarmed');
            bodyRoot.classList.remove('mascot-hop', 'mascot-alarmed');

            if (emotion === 'happy') {
                svgEl.classList.add('emotion-happy');
                void bodyRoot.offsetWidth;
                bodyRoot.classList.add('mascot-hop');
                if (pupilCore) pupilCore.setAttribute('fill', '#39ff88');
                if (stateBadge) {
                    stateBadge.innerText = 'MOOD: EXCITED!';
                    stateBadge.className = 'text-[#39ff88] font-bold';
                }
            } else if (emotion === 'alarmed') {
                svgEl.classList.add('emotion-alarmed');
                void bodyRoot.offsetWidth;
                bodyRoot.classList.add('mascot-alarmed');
                if (pupilCore) pupilCore.setAttribute('fill', '#ffb4ab');
                if (stateBadge) {
                    stateBadge.innerText = 'MOOD: STARTLED!';
                    stateBadge.className = 'text-[#ffb4ab] font-bold';
                }
            }

            if (durationMs > 0) {
                emotionResetTimer = setTimeout(() => {
                    svgEl.classList.remove('emotion-happy', 'emotion-alarmed');
                    bodyRoot.classList.remove('mascot-hop', 'mascot-alarmed');
                    if (pupilCore) pupilCore.setAttribute('fill', '#00d9ff');
                    if (isAllInputsValid) {
                        triggerWelcomePose();
                    } else {
                        updateMascotPrivacyState();
                    }
                }, durationMs);
            }
        }

        function updateMascotPrivacyState() {
            const svgEl = document.getElementById('mascot-svg');
            const bodyRoot = document.getElementById('mascot-body-root');
            const stateBadge = document.getElementById('mascot-state-badge');
            if (!svgEl) return;

            if (isAllInputsValid && !isPasswordFocused) {
                triggerWelcomePose();
                return;
            }

            svgEl.classList.remove('privacy-shield', 'privacy-peek', 'emotion-welcome');
            if (bodyRoot) bodyRoot.classList.remove('mascot-giggle', 'mascot-welcome-bob');

            if (isPasswordFocused) {
                if (isPeekingPassword) {
                    svgEl.classList.add('privacy-peek');
                    if (bodyRoot) bodyRoot.classList.add('mascot-giggle');
                    if (stateBadge) {
                        stateBadge.innerText = 'MOOD: CHEEKY PEEK';
                        stateBadge.className = 'text-[#39ff88] font-bold';
                    }
                } else {
                    svgEl.classList.add('privacy-shield');
                    if (stateBadge) {
                        stateBadge.innerText = 'MOOD: SHY / SHIELDED';
                        stateBadge.className = 'text-[#7ce0ff] font-bold';
                    }
                }
            } else {
                if (stateBadge) {
                    stateBadge.innerText = 'MOOD: CURIOUS WALK';
                    stateBadge.className = 'text-[#7ce0ff] font-bold';
                }
            }
        }

        function triggerNaughtySneakPeek(inp) {
            if (!isPasswordFocused || isPeekingPassword) return;
            const svgEl = document.getElementById('mascot-svg');
            const bodyRoot = document.getElementById('mascot-body-root');
            const stateBadge = document.getElementById('mascot-state-badge');
            if (!svgEl) return;

            svgEl.classList.remove('privacy-shield');
            svgEl.classList.add('privacy-peek');
            if (bodyRoot) bodyRoot.classList.add('mascot-giggle');
            if (stateBadge) {
                stateBadge.innerText = 'MOOD: SNEAK PEEKING';
                stateBadge.className = 'text-[#39ff88] font-bold';
            }

            if (inp) {
                const r = inp.getBoundingClientRect();
                pointEyeAt(r.left + r.width * 0.5, r.top + r.height * 0.5, false, true);
            }

            clearTimeout(naughtySneakTimer);
            naughtySneakTimer = setTimeout(() => {
                if (isPasswordFocused && !isPeekingPassword) {
                    updateMascotPrivacyState();
                }
            }, 650);
        }

        function togglePasskeyPeek(inputId, btnEl) {
            const inp = document.getElementById(inputId);
            if (!inp) return;

            if (inp.type === 'password') {
                inp.type = 'text';
                isPeekingPassword = true;
                btnEl.innerHTML = `<svg class="w-4 h-4 fill-none stroke-[#39ff88]" stroke-width="2" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
            } else {
                inp.type = 'password';
                isPeekingPassword = false;
                btnEl.innerHTML = `<svg class="w-4 h-4 fill-none stroke-current" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
            }

            isPasswordFocused = true;
            inp.focus();
            updateMascotPrivacyState();

            if (isPeekingPassword) {
                const r = inp.getBoundingClientRect();
                pointEyeAt(r.left + r.width * 0.5, r.top + r.height * 0.5, true, true);
            }
        }

        function pointEyeAt(clientX, clientY, isClickPulse = false, allowDuringPeek = false) {
            const svgEl = document.getElementById('mascot-svg');
            const pupilGroup = document.getElementById('mascot-pupil-group');
            const irisRing = document.getElementById('pupil-iris-ring');
            const pupilCore = document.getElementById('pupil-core');
            const coordsEl = document.getElementById('bp-cursor-coords');

            if (!svgEl || !pupilGroup) return;
            if (isPasswordFocused && !isPeekingPassword && !allowDuringPeek) return;

            const rect = svgEl.getBoundingClientRect();
            const eyeScreenX = rect.left + rect.width * 0.46;
            const eyeScreenY = rect.top + rect.height * 0.26;

            const deltaX = clientX - eyeScreenX;
            const deltaY = clientY - eyeScreenY;
            const angleRad = Math.atan2(deltaY, deltaX);
            const angleDeg = Math.round((angleRad * 180) / Math.PI);

            const maxRadius = (isPeekingPassword || allowDuringPeek) ? 4.5 : 10.5;
            const distance = Math.min(maxRadius, Math.hypot(deltaX, deltaY) / 14);

            const tx = Math.cos(angleRad) * distance;
            const ty = Math.sin(angleRad) * distance;

            pupilGroup.style.transform = `translate(${tx.toFixed(2)}px, ${ty.toFixed(2)}px)`;

            if (irisRing) {
                irisRing.style.transform = `rotate(${angleDeg + 90}deg)`;
            }

            if (coordsEl) {
                coordsEl.innerText = `ANG: ${angleDeg}°`;
            }

            if (isClickPulse && pupilCore) {
                pupilCore.setAttribute('fill', '#39ff88');
                pupilCore.setAttribute('r', '6.5');
                setTimeout(() => {
                    pupilCore.setAttribute('fill', '#00d9ff');
                    pupilCore.setAttribute('r', '5');
                }, 220);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.expand();
                window.Telegram.WebApp.ready();
            }

            const svgEl = document.getElementById('mascot-svg');

            if (svgEl) {
                svgEl.addEventListener('pointerdown', (e) => {
                    e.stopPropagation();
                    if (!isPasswordFocused) {
                        triggerMascotEmotion('happy', 850);
                    }
                });
            }

            window.addEventListener('pointermove', (e) => {
                lastInteractionTime = Date.now();
                pointEyeAt(e.clientX, e.clientY, false);
            }, { passive: true });

            window.addEventListener('touchstart', (e) => {
                if (e.touches && e.touches.length > 0) {
                    lastInteractionTime = Date.now();
                    pointEyeAt(e.touches[0].clientX, e.touches[0].clientY, true);
                }
            }, { passive: true });

            window.addEventListener('touchmove', (e) => {
                if (e.touches && e.touches.length > 0) {
                    lastInteractionTime = Date.now();
                    pointEyeAt(e.touches[0].clientX, e.touches[0].clientY, false);
                }
            }, { passive: true });

            window.addEventListener('pointerdown', (e) => {
                lastInteractionTime = Date.now();
                pointEyeAt(e.clientX, e.clientY, true);
                if (!isPasswordFocused && !isAllInputsValid) {
                    const bodyRoot = document.getElementById('mascot-body-root');
                    if (bodyRoot) {
                        bodyRoot.classList.remove('mascot-hop');
                        void bodyRoot.offsetWidth;
                        bodyRoot.classList.add('mascot-hop');
                        setTimeout(() => bodyRoot.classList.remove('mascot-hop'), 450);
                    }
                }
            }, { passive: true });

            setInterval(() => {
                if (isAllInputsValid && !isPasswordFocused) return;
                if (isPasswordFocused && !isPeekingPassword) {
                    if (Math.random() < 0.3) {
                        triggerNaughtySneakPeek(document.activeElement);
                    }
                    return;
                }
                if (Date.now() - lastInteractionTime < 2200) return;

                const randomX = Math.random() * window.innerWidth;
                const randomY = Math.random() * window.innerHeight;
                pointEyeAt(randomX, randomY, Math.random() < 0.3);

                if (svgEl && Math.random() < 0.32) {
                    svgEl.classList.add('mascot-wink');
                    setTimeout(() => svgEl.classList.remove('mascot-wink'), 140);
                    if (Math.random() < 0.4) {
                        setTimeout(() => {
                            svgEl.classList.add('mascot-wink');
                            setTimeout(() => svgEl.classList.remove('mascot-wink'), 140);
                        }, 220);
                    }
                }
            }, 1500);
        document.querySelectorAll('input').forEach((inp) => {
                const isPass = inp.classList.contains('passkey-field');

                inp.addEventListener('focus', () => {
                    lastInteractionTime = Date.now();
                    if (isPass) {
                        isPasswordFocused = true;
                        isPeekingPassword = (inp.type === 'text');
                        updateMascotPrivacyState();
                    } else {
                        isPasswordFocused = false;
                        updateMascotPrivacyState();
                        const r = inp.getBoundingClientRect();
                        pointEyeAt(r.left + r.width / 2, r.top + r.height / 2, true);
                    }
                });

                inp.addEventListener('input', () => {
                    lastInteractionTime = Date.now();
                    checkAllActiveInputsValid();

                    if (isPass && !isPeekingPassword) {
                        if (inp.value.length > 0 && inp.value.length % 4 === 0) {
                            triggerNaughtySneakPeek(inp);
                        }
                    } else {
                        const r = inp.getBoundingClientRect();
                        const progress = Math.min(1, inp.value.length / 22);
                        pointEyeAt(r.left + 20 + progress * (r.width * 0.65), r.top + r.height / 2, false, true);
                    }
                });

                inp.addEventListener('blur', () => {
                    setTimeout(() => {
                        const active = document.activeElement;
                        if (!active || !active.classList.contains('passkey-field')) {
                            isPasswordFocused = false;
                            updateMascotPrivacyState();
                        }
                    }, 120);
                });
            });
        });

        function showAlert(msg, isError) {
            const box = document.getElementById('auth-alert');
            box.classList.remove('hidden', 'bg-red-950/60', 'border-red-400', 'text-red-200', 'bg-emerald-950/60', 'border-[#39ff88]', 'text-[#39ff88]');
            if (isError) {
                box.classList.add('bg-red-950/60', 'border-red-400', 'text-red-200');
                triggerMascotEmotion('alarmed', 1100);
            } else {
                box.classList.add('bg-emerald-950/60', 'border-[#39ff88]', 'text-[#39ff88]');
                triggerMascotEmotion('happy', 1100);
            }
            box.innerText = msg;
        }

        function switchAuthView(view) {
            const views = ['login-form', 'login-otp-form', 'register-form', 'register-otp-form', 'forgot-form', 'reset-form'];
            views.forEach(id => document.getElementById(id).classList.add('hidden'));
            document.getElementById('auth-alert').classList.add('hidden');

            isPasswordFocused = false;
            isPeekingPassword = false;
            isAllInputsValid = false;
            hasWelcomedThisSet = false;
            updateMascotPrivacyState();

            const loginBtn = document.getElementById('tab-login-btn');
            const regBtn = document.getElementById('tab-register-btn');

            if (view === 'register' || view === 'register-otp') {
                document.getElementById(view === 'register' ? 'register-form' : 'register-otp-form').classList.remove('hidden');
                regBtn.className = "py-1.5 font-bold uppercase tracking-wider transition-all bg-[#1c539e] text-white border border-[#bae0ff]/80 cursor-pointer";
                loginBtn.className = "py-1.5 font-bold uppercase tracking-wider transition-all text-[#bae0ff] hover:text-white cursor-pointer";
            } else if (view === 'forgot') {
                document.getElementById('forgot-form').classList.remove('hidden');
            } else if (view === 'reset') {
                document.getElementById('reset-form').classList.remove('hidden');
            } else if (view === 'login-otp') {
                document.getElementById('login-otp-form').classList.remove('hidden');
            } else {
                document.getElementById('login-form').classList.remove('hidden');
                loginBtn.className = "py-1.5 font-bold uppercase tracking-wider transition-all bg-[#1c539e] text-white border border-[#bae0ff]/80 cursor-pointer";
                regBtn.className = "py-1.5 font-bold uppercase tracking-wider transition-all text-[#bae0ff] hover:text-white cursor-pointer";
            }

            checkAllActiveInputsValid();
        }

        function toggleAuthMode(mode) {
            switchAuthView(mode);
        }

        async function handleLoginStep1(e) {
            e.preventDefault();
            const btn = document.getElementById('login-submit-btn');
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;
            const email = document.getElementById('login-legacy-email').value.trim();

            btn.disabled = true;
            btn.innerText = 'VERIFYING...';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, email })
                });
                const data = await res.json();

                if (data.needsEmail) {
                    document.getElementById('legacy-email-box').classList.remove('hidden');
                    document.getElementById('login-legacy-email').required = true;
                    checkAllActiveInputsValid();
                    showAlert(data.error, true);
                } else if (!data.success) {
                    showAlert(data.error || 'Authentication failed.', true);
                } else if (data.requireOtp) {
                    pendingLoginEmail = data.email;
                    document.getElementById('login-otp-target-email').innerText = data.email;
                    switchAuthView('login-otp');
                    showAlert(data.message, false);
                } else if (data.token) {
                    localStorage.setItem('token', data.token);
                    sessionStorage.setItem('active_session', '1');
                    showAlert('ACCESS GRANTED. Redirecting...', false);
                    setTimeout(() => { window.location.href = '/dashboard'; }, 550);
                }
            } catch (err) {
                showAlert('Server connection failed. Please try again.', true);
            } finally {
                btn.disabled = false;
                btn.innerText = 'Authenticate Session →';
            }
        }

        async function handleLoginStep2(e) {
            e.preventDefault();
            const btn = document.getElementById('login-verify-btn');
            const otp = document.getElementById('login-otp-code').value.trim();

            btn.disabled = true;
            btn.innerText = 'VERIFYING OTP...';

            try {
                const res = await fetch('/api/auth/login-verify', {
                    method: 'POST',

                    showAlert('2FA VERIFIED! Redirecting...', false);

                }
            } catch (err) {
                showAlert('OTP verification request failed.', true);
            } finally {
                btn.disabled = false;
                btn.innerText = 'Verify Sign-In OTP';
            }
        }

                showAlert('Network error while requesting verification code.', true);
            } finally {

                btn.innerText = 'Send Verification Code →';
            }
        }

        async function handleRegisterStep2(e) {
            e.preventDefault();

            try {

        async function handleForgotStep1(e) {
            e.preventDefault();
            const btn = document.getElementById('forgot-submit-btn');
            const identifier = document.getElementById('forgot-identifier').value.trim();

            btn.disabled = true;
            btn.innerText = 'DISPATCHING...';

            try {
                const res = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier })
                });
                const data = await res.json();

                if (!data.success) {
                    showAlert(data.error || 'Account not found.', true);
                } else {
                    pendingResetEmail = data.email;
                    switchAuthView('reset');
                    showAlert(data.message, false);
                }
            } catch (err) {
                showAlert('Error communicating with server.', true);
            } finally {
                btn.disabled = false;
                btn.innerText = 'Send Reset Code';
            }
        }

        async function handleForgotStep2(e) {
            e.preventDefault();
            const btn = document.getElementById('reset-submit-btn');
            const otp = document.getElementById('reset-otp-code').value.trim();
            const newPassword = document.getElementById('reset-new-password').value;

            btn.disabled = true;
            btn.innerText = 'UPDATING...';

            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: pendingResetEmail, otp, newPassword })
                });
                const data = await res.json();

                if (!data.success) {
                    showAlert(data.error || 'Passkey reset failed.', true);
                } else {
                    switchAuthView('login');
                    showAlert(data.message, false);
                }
            } catch (err) {
                showAlert('Failed to update passkey.', true);
            } finally {
                btn.disabled = false;
                btn.innerText = 'Update Passkey';
            }
        }
    </script>
