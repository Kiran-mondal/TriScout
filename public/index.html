<!DOCTYPE html>
<html>
<head>
    <title>TRISCOUT // LOGIN</title>
    
    <!-- এই লাইনটিই মোবাইল স্ক্রিনে সাইজ ঠিক করবে -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px; /* মোবাইলের সাইডে ফাঁকা রাখার জন্য */
            box-sizing: border-box;
        }

        .login-card {
            background: var(--card-bg);
            padding: 40px; 
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 450px; 
            box-sizing: border-box;
            position: relative;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            width: 15px;
            height: 15px;
            border-top: 2px solid var(--accent-green);
            border-left: 2px solid var(--accent-green);
        }

        .logo-header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 35px;
        }
        
        .logo-header img {
            width: 45px;
            height: 45px;
            margin-right: 15px;
        }

        .logo-header h2 {
            color: var(--accent-green);
            letter-spacing: 4px;
            margin: 0;
            font-size: 32px;
            text-shadow: 0 0 8px rgba(212, 255, 0, 0.4);
        }

        /* মোবাইলের জন্য লেখার সাইজ একটু ছোট করা হলো */
        @media (max-width: 480px) {
            .logo-header h2 {
                font-size: 26px;
            }
            .login-card {
                padding: 30px 20px;
            }
        }

        .divider {
            text-align: center;
            margin: 30px 0;
            color: var(--text-muted);
            font-size: 12px;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
        }
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px dashed var(--border-color);
        }
        .divider::before { margin-right: 15px; }
        .divider::after { margin-left: 15px; }
        
        .github-btn {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--text-main);
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .github-btn:hover {
            background: var(--text-main);
            color: #000;
        }
        .full-width-btn {
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="login-card">
        
        <div class="logo-header">
            <img src="/logo.svg" alt="TriScout Logo">
            <h2>TRISCOUT</h2>
        </div>

        <button class="github-btn" onclick="window.location.href='/api/auth/github'">
            <!-- গিটহাবের ভেক্টর লোগোটি বাটনের ভেতর যুক্ত করা হলো -->
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
            </svg>
            AUTHENTICATE VIA GITHUB
        </button>

        <div class="divider">OR LOCAL ADMIN</div>

        <input type="text" id="username" class="input-box" placeholder="USERNAME">
        <input type="password" id="password" class="input-box" placeholder="PASSWORD">
        
        <button class="full-width-btn" onclick="login()">ACCESS SYSTEM</button>
    </div>

    <script>
        function login() {
            alert('LOCAL LOGIN FUNCTION INITIATED');
        }
    </script>
</body>
</html>
